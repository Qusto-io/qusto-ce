name: Deploy Variant Guard

# Production (qusto-prod-1) runs a MIX_ENV=ce image.
# extra/ and assets/js/dashboard/extra/ are not in this tree. Tags published
# before the removal still contain them. This guard fails if either path returns.

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

jobs:
  variant-guard:
    name: variant-guard
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: No image may be built with the proprietary extra/lib (OC-03)
        run: |
          set -euo pipefail
          hits="$(grep -rnE 'MIX_ENV[=:][[:space:]]*"?prod' \
                    .github/workflows Dockerfile docker-compose*.yml 2>/dev/null \
                  | grep -v 'deploy-variant-guard.yml' || true)"
          if [ -n "${hits}" ]; then
            echo "::error::An image build sets MIX_ENV=prod. Production ships MIX_ENV=ce:"
            echo "${hits}"
            exit 1
          fi
          echo "No image build uses MIX_ENV=prod."

      - name: Fail if extra/ is present
        run: |
          set -euo pipefail
          if [ -e extra ] || [ -e assets/js/dashboard/extra ]; then
            echo "::error::extra/ or assets/js/dashboard/extra is present. Those trees are not part of HEAD."
            exit 1
          fi
          echo "OK: extra trees are absent"
