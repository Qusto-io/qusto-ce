name: Validate migrations

on:
  pull_request:
    paths:
      - 'priv/repo/migrations/**'
      - 'priv/ingest_repo/migrations/**'

jobs:
  validate:
    name: App code does not change at the same time
    runs-on: ubuntu-latest
    if: ${{ !contains(github.event.pull_request.labels.*.name, 'upstream-merge') }}

    steps:
    - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
      id: changes
      with:
        list-files: json
        predicate-quantifier: 'every'
        filters: |
          lib:
            - 'lib/**'
            - '!lib/plausible/data_migration/**'
            - '!lib/plausible/migration_utils.ex'
            - '!lib/mix/tasks/generate_countries_meta.ex'
          extra:
            - 'extra/**'
          config:
            - 'config/**'

    - if: |
        !contains(github.event.pull_request.labels.*.name, 'upstream-merge') &&
        (steps.changes.outputs.lib == 'true' || steps.changes.outputs.extra == 'true' || steps.changes.outputs.config == 'true')
      run: |
        echo "::error file=${{ fromJSON(steps.changes.outputs.lib_files)[0] }}::Code and migrations shouldn't be changed at the same time"
        exit 1
