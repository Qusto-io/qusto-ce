name: Open Core Guard

# The public engine must never carry the private services, Plausible's
# proprietary extra/ tree, env files or credentials. See
# scripts/ci/open-core-guard.sh for the exact rules.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  open-core-guard:
    name: open-core-guard
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run guard
        run: bash scripts/ci/open-core-guard.sh
