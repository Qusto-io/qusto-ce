<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <title>Qusto Playwright tests</title>
    <script>
      window.__qusto = true
      window.__plausible = true
    </script>
    <script
      id="qusto"
      data-domain="example.com"
      data-api="http://localhost:3000/api/event"
      src="/tracker/js/plausible.hash.local.manual.js"
    ></script>
    <script>
      window.qusto =
        window.qusto ||
        function () {
          ;(window.qusto.q = window.qusto.q || []).push(arguments)
        }
    </script>
  </head>

  <body>
    <a id="about-us-hash-link" href="#about">About us</a>
    <a id="home-hash-link" href="#home">Home</a>

    <div>
      <p id="page-title">Home</p>
    </div>

    <script>
      const titleNode = document.getElementById('page-title')

      function updateContent() {
        if (location.hash === '#about') {
          titleNode.innerHTML = 'About us'
          window.qusto('pageview', { u: 'http://localhost:3000/#about-us' })
        } else {
          titleNode.innerHTML = 'Home'
          window.qusto('pageview', { u: 'http://localhost:3000/#home' })
        }
      }

      window.qusto('pageview', { u: 'http://localhost:3000/#home' })
      window.addEventListener('hashchange', updateContent)
    </script>
  </body>
</html>
